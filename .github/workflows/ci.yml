name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Simulate every act
        run: SEEDS=1 npm run lint:acts
      - uses: actions/upload-artifact@v4
        with:
          name: seasonal-scenes
          path: dist/seasonal-scenes.js
