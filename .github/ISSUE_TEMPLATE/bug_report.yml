name: Bug report
description: Something is broken or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. A screenshot or screen recording helps a lot.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Card configuration
      description: The YAML of the card (Edit card -> Show code editor).
      render: yaml
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Card version, Home Assistant version, browser or app (and device, if it is a wall panel).
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: Anything red in the browser's developer console.
      render: text
